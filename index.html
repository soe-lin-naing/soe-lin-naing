<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow"></div>

    <main class="container">
      <div class="heart-wrap" aria-label="Animated heart">
        <div class="heart">❤</div>
      </div>

      <section class="card">
        <p class="subtitle">For the one I love</p>
        <h1>Love You So Much</h1>
        <p class="message">
          Every moment with you feels like a beautiful dream. Your smile makes the world brighter,
          your love makes my heart stronger, and your presence makes life feel complete.
        </p>

        <div class="photo-frame reveal-photo">
          <img
            src="images/love-photo.jpeg"
            alt="Love photo"
          />
        </div>

        <div class="qr-section">
          <p class="qr-label">Scan to visit</p>
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https://your-site-name.netlify.app"
            alt="QR code to visit the website"
            class="qr-code"
          />
        </div>

        <p class="signature">Forever yours ❤️</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
